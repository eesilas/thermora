<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡通記憶翻翻樂</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5e6 0%, #e6f4ff 100%);
      --card-back: linear-gradient(135deg, #5c7cfa 0%, #748ffc 100%);
      --card-back-border: #4263eb;
      --primary: #ff6b6b;
      --primary-hover: #fa5252;
      --secondary: #339af0;
      --success: #51cf66;
      --text-main: #2b2d42;
      --text-sub: #5c6274;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 14px 36px rgba(43, 45, 66, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    header {
      text-align: center;
      width: 100%;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.8rem;
      color: #364fc7;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: 0;
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .size-selector {
      display: flex;
      background: #edf2ff;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .size-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #4c6ef5;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-btn.active {
      background: #4c6ef5;
      color: #fff;
      box-shadow: 0 3px 8px rgba(76, 110, 245, 0.35);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-restart {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
    }

    .btn-restart:hover {
      background: var(--primary-hover);
    }

    .btn-sound {
      background: #f1f3f5;
      color: var(--text-main);
    }

    .btn-sound:hover {
      background: #e9ecef;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #f8f9fa;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid #e9ecef;
    }

    .stat-item span {
      color: #364fc7;
      font-weight: 800;
      font-size: 1.08rem;
      margin-left: 4px;
    }

    .board {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      perspective: 1000px;
    }

    .board.grid-3 { grid-template-columns: repeat(3, 1fr); }
    .board.grid-4 { grid-template-columns: repeat(4, 1fr); }
    .board.grid-5 { grid-template-columns: repeat(5, 1fr); }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      cursor: default;
    }

    .card.matched .card-front {
      background: #ebfbee;
      border-color: var(--success);
      box-shadow: 0 0 0 2px rgba(81, 207, 102, 0.35);
      animation: popMatch 0.4s ease;
    }

    @keyframes popMatch {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .card-back {
      background: var(--card-back);
      border: 3px solid var(--card-back-border);
      color: rgba(255, 255, 255, 0.9);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.2) 2px, transparent 2px),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.2) 2px, transparent 2px),
        var(--card-back);
      background-size: 18px 18px, 18px 18px, 100% 100%;
    }

    .card-back-icon {
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .grid-5 .card-back-icon {
      font-size: 1.35rem;
    }

    .card-front {
      background: #ffffff;
      border: 3px solid #dee2e6;
      transform: rotateY(180deg);
    }

    .card-front svg {
      width: 72%;
      height: 72%;
      max-width: 82px;
      max-height: 82px;
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 2px;
      line-height: 1;
    }

    .grid-5 .card-label {
      font-size: 0.62rem;
    }

    .note {
      font-size: 0.82rem;
      color: #868e96;
      text-align: center;
      min-height: 1.2em;
    }

    /* 勝利彈窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(33, 37, 41, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.show .modal-box {
      transform: scale(1);
    }

    .trophy {
      font-size: 3.6rem;
      margin-bottom: 8px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 1.65rem;
      color: #2b8a3e;
    }

    .modal-msg {
      margin: 0 0 18px;
      font-size: 1rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .modal-stats {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.8;
    }

    .btn-play-again {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 1.05rem;
      background: #40c057;
      color: #fff;
      box-shadow: 0 6px 14px rgba(64, 192, 87, 0.35);
    }

    .btn-play-again:hover {
      background: #37b24d;
    }

    @media (max-width: 480px) {
      .game-container { padding: 14px; gap: 12px; }
      h1 { font-size: 1.45rem; }
      .board { gap: 7px; }
      .card-face { border-radius: 10px; border-width: 2px; }
      .card-label { display: none; }
    }
  </style>
</head>
<body>

    </header>

        <button class="size-btn active" data-size="4">4 × 4</button>
        <button class="size-btn" data-size="5">5 × 5</button>
      </div>
      <button class="btn btn-restart" id="restartBtn">🔄 重新開始</button>
      <button class="btn btn-sound" id="soundBtn" title="切換音效">🔊 音效開</button>
    </div>

    <div class="stats-bar">
      <div class="stat-item">翻牌次數<span id="movesCount">0</span></div>
      <div class="stat-item">配對進度<span id="pairsCount">0 / 8</span></div>
      <div class="stat-item">花費時間<span id="timerDisplay">00:00</span></div>
    </div>

    <div class="board grid-4" id="board"></div>

    <div class="note" id="gridNote"></div>
  </div>

      <div class="modal-stats" id="finalStats"></div>
      <button class="btn btn-play-again" id="modalRestartBtn">🎉 再玩一次</button>
    </div>
  </div>

    // Web Audio API 音效引擎
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', delay = 0, volume = 0.15) {
      if (!soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      gain.gain.setValueAtTime(volume, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration);
    }

    function playFlipSound() {
      playTone(480, 0.08, 'triangle', 0, 0.12);
    }

      playTone(523.25, 0.12, 'sine', 0, 0.16);   // C5

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      if (gameStarted) return;
      gameStarted = true;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerEl.textContent = formatTime(secondsElapsed);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function initGame() {

      bonusFound = false;

      secondsElapsed = 0;

          <div class="card-face card-front">
            ${cardData.svg}
            <span class="card-label">${cardData.name}</span>
          </div>
        `;

        cardEl.addEventListener('click', () => handleCardClick(cardEl, cardData));
        boardEl.appendChild(cardEl);
      });
    }
