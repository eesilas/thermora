<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小小家政廚神｜互動烹飪及上菜教室</title>
  <style>
    :root {
      --bg-cream: #fff8ee;
      --bg-panel: #ffffff;
      --primary: #ff7a3d;
      --primary-dark: #e25b1d;
      --secondary: #3ba99c;
      --accent: #ffc947;
      --text-main: #3d2c2e;
      --text-sub: #7a686a;
      --border-soft: #f0dfd1;
      --shadow: 0 8px 24px rgba(105, 65, 35, 0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, #fffdf9 0%, #ffeed9 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #ff8547 0%, #ff6037 100%);
      color: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(226, 91, 29, 0.25);
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 30px;
      background: rgba(255, 255, 255, 0.2);
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      opacity: 0.92;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.22);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      color: white;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    /* Wrapper */
    .page-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Main 3-Column Kitchen */
    main {
      display: grid;
      grid-template-columns: 310px 1fr 280px;
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      background: var(--bg-panel);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border-soft);
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px dashed var(--border-soft);
    }

    .panel-title h2 {
      margin: 0;
      font-size: 1.08rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      background: var(--primary);
      color: white;
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .sub-hint {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    /* Ingredients Grid */
    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      flex: 1;
    }

    .item-card {
      background: #fffaf4;
      border: 2px solid #f2e2d2;
      border-radius: 15px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 6px 14px rgba(255, 122, 61, 0.15);
    }

    .item-card.selected {
      background: #fff1e6;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 122, 61, 0.2);
    }

    .item-card.selected::after {
      content: "✓";
      position: absolute;
      top: 5px;
      right: 7px;
      background: var(--primary);
      color: white;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: grid;
      place-items: center;
    }

    .item-emoji {
      font-size: 2rem;
      line-height: 1;
    }

    .item-name {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .item-cat {
      font-size: 0.7rem;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.04);
      padding: 1px 7px;
      border-radius: 999px;
    }

    /* Cooking Methods */
    .methods-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .method-card {
      background: #f8fbfb;
      border: 2px solid #dceceb;
      border-radius: 18px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .method-card:hover {
      transform: translateX(-3px);
      border-color: var(--secondary);
    }

    .method-card.selected {
      background: #e8f8f6;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(59, 169, 156, 0.2);
    }

    .method-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: white;
      display: grid;
      place-items: center;
      font-size: 1.65rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
      flex-shrink: 0;
    }

    .method-info h3 {
      margin: 0;
      font-size: 1.02rem;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .method-tool-tag {
      font-size: 0.72rem;
      background: var(--secondary);
      color: white;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .method-info p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Center Stage */
    .kitchen-stage {
      background: linear-gradient(180deg, #fffcf7 0%, #fff1df 65%, #ecd6be 65%, #e3c7aa 100%);
      position: relative;
      overflow: hidden;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .stage-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 16px;
      border: 1.5px solid var(--border-soft);
      z-index: 2;
      flex-wrap: wrap;
      gap: 8px;
    }

    .selected-tray {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tray-pill {
      background: #fff2e6;
      border: 1px solid #ffd1ad;
      color: #a1450b;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: popIn 0.2s ease;
    }

    .tool-badge {
      background: #e7f6f4;
      border: 1px solid #a8dfd8;
      color: #1f6b62;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
    }

    /* Pot & Stove Area */
    .stove-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 10px auto;
      cursor: pointer;
    }

    .cooking-hint-bubble {
      position: absolute;
      top: 4px;
      background: rgba(61, 44, 46, 0.88);
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 10;
    }

    .cooking-hint-bubble.visible {
      opacity: 1;
      transform: translateY(0);
      animation: floatUpDown 1.2s infinite ease-in-out;
    }

    .pot-svg {
      width: 320px;
      height: 290px;
      overflow: visible;
      transition: transform 0.15s ease;
    }

    .stove-wrapper.stirring .pot-svg {
      animation: potShake 0.3s ease;
    }

    /* Flame & Cooking Animations */
    .flames-group {
      opacity: 0;
      transition: opacity 0.3s ease;
      transform-origin: center bottom;
    }

    .is-cooking .flames-group { opacity: 1; }

    .flame-outer {
      animation: flickerOuter 0.25s infinite alternate ease-in-out;
      transform-origin: 160px 235px;
    }

    .flame-inner {
      animation: flickerInner 0.18s infinite alternate ease-in-out;
      transform-origin: 160px 235px;
    }

    .is-high-heat .flames-group {
      transform: scale(1.22, 1.3);
    }

    .steam-puff { opacity: 0; }
    .is-cooking .steam-puff { animation: riseSteam 1.6s infinite ease-out; }
    .is-cooking .steam-puff.delay-1 { animation-delay: 0.4s; }
    .is-cooking .steam-puff.delay-2 { animation-delay: 0.9s; }

    .bubble-dot { opacity: 0; }
    .is-cooking .bubble-dot { animation: bubblePop 0.9s infinite ease-in; }
    .is-cooking .bubble-dot.b2 { animation-delay: 0.3s; }
    .is-cooking .bubble-dot.b3 { animation-delay: 0.6s; }

    .spatula-group {
      transform-origin: 215px 100px;
      transition: transform 0.3s;
    }
    .is-cooking .spatula-group {
      animation: stirFryMotion 0.55s infinite alternate ease-in-out;
    }

    .pot-ingredients-layer {
      font-size: 28px;
      text-anchor: middle;
    }

    /* Controls */
    .stage-controls {
      width: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-wrap {
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      height: 16px;
      padding: 3px;
      border: 1.5px solid #e4cbb2;
      display: none;
    }

    .progress-wrap.active { display: block; }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffb347 0%, #ff5722 100%);
      transition: width 0.1s linear;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-cook {
      flex: 1;
      max-width: 260px;
      background: linear-gradient(135deg, #ff7a3d 0%, #e64926 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(230, 73, 38, 0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-cook:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(230, 73, 38, 0.45);
    }

    .btn-cook:disabled {
      background: #cbbab0;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-reset {
      background: white;
      color: var(--text-main);
      border: 2px solid #e5d5c5;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover:not(:disabled) {
      background: #fff5eb;
      border-color: var(--primary);
    }

    .btn-reset:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ========= 畫出來的餐檯場景 (Drawn Dining Table) ========= */
    .dining-table-panel {
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid var(--border-soft);
      border-radius: 24px;
      padding: 18px 22px 24px;
      box-shadow: var(--shadow);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-header h2 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-table {
      background: #fff5ea;
      border: 1.5px solid #e2c09d;
      color: #6b4c2f;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear-table:hover {
      background: #ffe8d1;
    }

    .drawn-table-scene {
      position: relative;
      padding: 6px 10px 0;
    }

    /* 木餐檯檯面 */
    .table-top-surface {
      position: relative;
      min-height: 175px;
      border-radius: 20px 20px 6px 6px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(120, 68, 25, 0.06) 0px,
          rgba(120, 68, 25, 0.06) 4px,
          transparent 4px,
          transparent 36px
        ),
        linear-gradient(180deg, #deb07a 0%, #cf985c 65%, #c28749 100%);
      border: 3px solid #a86f38;
      border-bottom: none;
      box-shadow: inset 0 6px 14px rgba(255, 240, 215, 0.45);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      overflow-x: auto;
    }

    /* 檯面中央格仔餐檯布 */
    .table-runner {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 92px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.22) 0px,
          rgba(255, 255, 255, 0.22) 14px,
          rgba(255, 232, 210, 0.35) 14px,
          rgba(255, 232, 210, 0.35) 28px
        );
      border-top: 2px dashed rgba(255, 255, 255, 0.65);
      border-bottom: 2px dashed rgba(255, 255, 255, 0.65);
      pointer-events: none;
    }

    /* 擺在檯面上的餸菜列 */
    .table-dishes-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 22px;
      width: 100%;
      min-height: 138px;
    }

    .table-empty-hint {
      width: 100%;
      text-align: center;
      background: rgba(255, 251, 244, 0.88);
      padding: 20px 18px;
      border-radius: 16px;
      color: #704b29;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 3px 10px rgba(90, 50, 15, 0.12);
    }

    /* 直接放在檯面上的碗或碟（無白框卡片） */
    .table-dish-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.2s ease;
      animation: serveSlideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .table-dish-item:hover {
      transform: translateY(-5px) scale(1.03);
    }

    .table-dish-svg {
      width: 164px;
      height: 124px;
      filter: drop-shadow(0 8px 6px rgba(72, 38, 12, 0.28));
    }

    .table-dish-label {
      margin-top: 2px;
      background: rgba(255, 250, 240, 0.95);
      border: 1.5px solid #c99763;
      color: #4a2e14;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      box-shadow: 0 2px 5px rgba(70, 38, 10, 0.16);
      white-space: nowrap;
    }

    /* 木檯邊緣厚度 */
    .table-edge {
      height: 20px;
      background: linear-gradient(180deg, #b3783d 0%, #8f5b28 100%);
      border: 3px solid #78491d;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 6px 12px rgba(80, 45, 15, 0.22);
    }

    /* 餐檯四隻木腳 */
    .table-legs {
      display: flex;
      justify-content: space-between;
      padding: 0 38px;
      height: 52px;
      position: relative;
    }

    .table-leg {
      width: 24px;
      height: 52px;
      background: linear-gradient(90deg, #9c6530 0%, #7d4c1f 65%, #663c16 100%);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 5px 8px rgba(70, 40, 12, 0.25);
    }

    .table-leg.inner-left,
    .table-leg.inner-right {
      height: 40px;
      width: 18px;
      opacity: 0.82;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 29, 20, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .modal-card {
      background: white;
      border-radius: 28px;
      max-width: 490px;
      width: 100%;
      padding: 24px 26px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .dish-ribbon {
      display: inline-block;
      background: #fff0d1;
      color: #b56500;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .plate-showcase {
      width: 240px;
      height: 185px;
      margin: 0 auto 8px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .dish-title {
      margin: 0 0 6px;
      font-size: 1.5rem;
      color: var(--text-main);
    }

    .dish-stars {
      font-size: 1.3rem;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .dish-desc {
      margin: 0 0 14px;
      color: var(--text-sub);
      font-size: 0.94rem;
      line-height: 1.5;
    }

    .edu-box {
      background: #f2fbf9;
      border: 2px solid #cbece6;
      border-radius: 16px;
      padding: 12px 14px;
      text-align: left;
      margin-bottom: 18px;
    }

    .edu-box h4 {
      margin: 0 0 4px;
      color: #1f6b62;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edu-box p {
      margin: 0;
      font-size: 0.86rem;
      color: #365955;
      line-height: 1.5;
    }

    .btn-modal-primary {
      width: 100%;
      background: linear-gradient(135deg, #ff7a3d 0%, #e25b1d 100%);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(226, 91, 29, 0.3);
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px 0 18px;
      text-align: left;
    }

    .collection-item {
      background: #fff9f2;
      border: 1.5px solid #f0dfd1;
      border-radius: 14px;
      padding: 10px;
      font-size: 0.85rem;
    }

    .collection-item strong {
      display: block;
      color: var(--primary-dark);
      margin-bottom: 3px;
    }

    /* Keyframes */
    @keyframes flickerOuter {
      0% { transform: scaleY(0.92) scaleX(1.03); }
      100% { transform: scaleY(1.08) scaleX(0.96); }
    }
    @keyframes flickerInner {
      0% { transform: scaleY(1.05) skewX(-3deg); }
      100% { transform: scaleY(0.9) skewX(3deg); }
    }
    @keyframes riseSteam {
      0% { opacity: 0; transform: translateY(10px) scale(0.7); }
      35% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-48px) scale(1.35); }
    }
    @keyframes bubblePop {
      0% { opacity: 0; transform: translateY(8px) scale(0.5); }
      50% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-22px) scale(1.1); }
    }
    @keyframes stirFryMotion {
      0% { transform: rotate(-10deg) translate(-8px, 2px); }
      100% { transform: rotate(14deg) translate(10px, -6px); }
    }
    @keyframes potShake {
      0% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-8px) rotate(-3deg); }
      60% { transform: translateY(-4px) rotate(3deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @keyframes serveSlideIn {
      0% { opacity: 0; transform: scale(0.75) translateY(-16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {

      }

      function playIgnite() {
        if (!state.soundEnabled) return;
        const c = getCtx();
        if (!c) return;
        const bufferSize = c.sampleRate * 0.28;
        const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (c.sampleRate * 0.1));
        }
        const noise = c.createBufferSource();
        noise.buffer = buffer;
        const filter = c.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 600;
        const gain = c.createGain();
        gain.gain.value = 0.24;
        noise.connect(filter).connect(gain).connect(c.destination);
        noise.start();
      }

      function playStir() {
        if (!state.soundEnabled) return;
        const c = getCtx();
        if (!c) return;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(280, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(420, c.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
        osc.connect(gain).connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.1);
      }

      function playDone() {
        if (!state.soundEnabled) return;
        const c = getCtx();
        if (!c) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = c.createOscillator();
          const gain = c.createGain();
          osc.type = "sine";
          const start = c.currentTime + idx * 0.09;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.14, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
          osc.connect(gain).connect(c.destination);
          osc.start(start);
          osc.stop(start + 0.36);
        });
      }

      return { playClick, playIgnite, playStir, playDone };
    })();

    // ========= 6. 互動邏輯 =========
    function toggleIngredient(id) {
      if (state.isCooking) return;
      SoundFX.playClick();
      const idx = state.selectedIngredients.indexOf(id);
      if (idx > -1) {
        state.selectedIngredients.splice(idx, 1);
      } else {
        if (state.selectedIngredients.length >= 3) {
          state.selectedIngredients.shift();
        }
        state.selectedIngredients.push(id);
      }
      renderIngredients();
      updateStageUI();
    }

    function selectMethod(id) {
      if (state.isCooking) return;
      SoundFX.playClick();
      state.selectedMethod = id;
      renderMethods();
      updateStageUI();
    }

    function resetAll() {
      if (state.isCooking) return;
      SoundFX.playClick();
      state.selectedIngredients = [];
      state.selectedMethod = null;
      renderIngredients();
      renderMethods();
      updateStageUI();
    }

    let cookTimer = null;

    function startCooking() {
      if (state.isCooking || state.selectedIngredients.length === 0 || !state.selectedMethod) return;

      state.isCooking = true;
      state.progress = 0;
      SoundFX.playIgnite();

      kitchenStage.classList.add("is-cooking");
      cookingHint.classList.add("visible");
      progressWrap.classList.add("active");
      progressFill.style.width = "0%";
      btnCook.disabled = true;
      btnReset.disabled = true;
      btnCook.textContent = "🔥 猛火烹飪中...";

      renderPotIngredients();

      cookTimer = setInterval(() => {
        state.progress += 2.8;
        progressFill.style.width = `${Math.min(100, state.progress)}%`;

        if (state.progress >= 100) {
          clearInterval(cookTimer);
          finishCooking();
        }
      }, 100);
    }

    stoveWrapper.addEventListener("click", () => {
      if (!state.isCooking) return;
      SoundFX.playStir();
      stoveWrapper.classList.remove("stirring");
      void stoveWrapper.offsetWidth;
      stoveWrapper.classList.add("stirring");
      state.progress = Math.min(100, state.progress + 12);
      progressFill.style.width = `${state.progress}%`;
    });

    function finishCooking() {
      state.isCooking = false;
      kitchenStage.classList.remove("is-cooking");
      cookingHint.classList.remove("visible");
      progressWrap.classList.remove("active");
      btnCook.textContent = "🔥 點火煮食！";

      serveDishToTable(dish);
      showResultModal(dish, true);
      updateStageUI();

    function getContainerInfo(containerType) {
      const map = {

    function generateDish(ingIds, methodId) {
      const sorted = [...ingIds].sort();
      const key = `${sorted.join("_")}_${methodId}`;
      const methodObj = METHODS.find(m => m.id === methodId);
      const ingObjs = ingIds.map(id => INGREDIENTS.find(i => i.id === id));
      const ingNames = ingObjs.map(i => i.name);

      if (SPECIAL_RECIPES[key]) {
        const sp = SPECIAL_RECIPES[key];
        return {
          key,
          isSpecial: true,
          container: sp.container,
          name: sp.name,
          stars: sp.stars,
          desc: sp.desc,
          edu: sp.edu,
          method: methodObj,
          ingredients: ingObjs
        };
      }

      let container = "stirfry_plate";
      if (methodId === "boil") container = "bowl";
      else if (methodId === "steam") container = "steamed_plate";
      else if (methodId === "fry") container = "fry_platter";

      const methodAdjectives = {
        steam: ["清蒸", "原汁蒸", "蔥油蒸"],
        stirfry: ["香炒", "家常小炒", "猛火炒"],
        boil: ["滾湯", "鮮味湯煮", "上湯"],
        fry: ["金黃脆炸", "香酥炸", "黃金脆皮"]
      };
      const adj = methodAdjectives[methodId][ingIds.length % 3];
      const combinedName = `${adj}${ingNames.join("")}`;
      const containerText =
        container === "bowl" ? "用大湯碗連湯連料熱辣辣擺上檯" :
        container === "fry_platter" ? "放上鋪好吸油紙嘅餐碟擺上檯" :
        "用靚靚瓷碟擺好盤端上檯";

      return {
        key,
        isSpecial: false,
        container,
        name: combinedName,
        stars: ingIds.length >= 2 ? "⭐⭐⭐⭐⭐" : "⭐⭐⭐⭐",
        desc: `你成功用「${methodObj.tool}」以「${methodObj.name}」法煮好「${combinedName}」，並${containerText}！`,
        edu: methodObj.eduTip,
        method: methodObj,
        ingredients: ingObjs
      };
    }

            <path d="M88 106 Q105 100 116 108" stroke="#52b788" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M126 125 Q142 120 155 127" stroke="#52b788" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M90 54 Q97 41 89 28" stroke="#8ecae6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
            <path d="M120 48 Q127 35 119 22" stroke="#8ecae6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
            <path d="M150 54 Q157 41 149 28" stroke="#8ecae6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 240 185" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="116" cy="116" rx="92" ry="42" fill="#ffffff" stroke="#dfcbb8" stroke-width="3"/>
          <ellipse cx="116" cy="116" rx="79" ry="34" fill="none" stroke="#e07a5f" stroke-width="2.5" opacity="0.7"/>
          <ellipse cx="116" cy="118" rx="64" ry="26" fill="#f7c88a" opacity="0.65"/>
          ${placeIngredients(116, 117, 33, 37)}
          <circle cx="80" cy="108" r="3" fill="#e63946"/>
          <circle cx="148" cy="122" r="3" fill="#4ea854"/>
          <circle cx="136" cy="100" r="2.8" fill="#4ea854"/>
          <line x1="175" y1="152" x2="225" y2="85" stroke="#9c6644" stroke-width="4" stroke-linecap="round"/>
          <line x1="185" y1="156" x2="233" y2="90" stroke="#7f5539" stroke-width="4" stroke-linecap="round"/>
          <path d="M88 55 Q95 43 87 31" stroke="#ff9f68" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
          <path d="M124 49 Q131 37 123 25" stroke="#ff9f68" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
        </svg>
      `;
    }

    function showResultModal(dish, isFreshCook = false) {
      const cInfo = getContainerInfo(dish.container);
      dishRibbon.textContent = dish.isSpecial
        ? `🌟 經典名菜出爐｜${cInfo.label}`
        : `🔔 叮！煮好啦｜${cInfo.label}`;
      plateShowcase.innerHTML = renderPlatedDishSVG(dish);
      dishTitle.textContent = dish.name;
      dishStars.textContent = dish.stars;
      dishDesc.textContent = dish.desc;
      dishEdu.textContent = dish.edu;
      btnCloseResult.textContent = isFreshCook ? "🍽️ 擺上餐檯，繼續煮！" : "👍 返回餐檯";
      resultModal.classList.add("open");
    }

    function serveDishToTable(dish) {
      state.servedTableDishes.unshift(dish);
      renderDiningTable();
    }

    function renderDiningTable() {
      if (state.servedTableDishes.length === 0) {
        tableDishesRow.innerHTML = `
          <div class="table-empty-hint">
            張檯仲係空嘅～快啲喺上面開火煮返碗「雲吞麵」或者炒碟「油雞／時蔬」擺上檯啦！
          </div>
        `;
        return;
      }

      tableDishesRow.innerHTML = state.servedTableDishes.map((dish, index) => `
        <div class="table-dish-item" data-idx="${index}" title="點擊查看「${dish.name}」做法與家政知識">
          <div class="table-dish-svg">${renderPlatedDishSVG(dish)}</div>
          <div class="table-dish-label">${dish.name}</div>
        </div>
      `).join("");

      tableDishesRow.querySelectorAll(".table-dish-item").forEach(item => {
        item.addEventListener("click", () => {
          SoundFX.playClick();
          const dish = state.servedTableDishes[Number(item.dataset.idx)];
          showResultModal(dish, false);
        });
      });
    }

    function saveToCollection(dish) {
      if (!state.discoveredDishes.some(d => d.key === dish.key)) {
        state.discoveredDishes.unshift({
          key: dish.key,
          name: dish.name,
          methodName: dish.method.name,
          containerLabel: getContainerInfo(dish.container).label,
          emojis: dish.ingredients.map(i => i.emoji).join(" ")
        });
        recipeCount.textContent = state.discoveredDishes.length;
      }
    }

    function openRecipeBook() {
      SoundFX.playClick();
      if (state.discoveredDishes.length === 0) {
        collectionGrid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #8c7a7c;">還沒有煮出任何菜式，快去廚房試試看吧！</p>`;
      } else {
        collectionGrid.innerHTML = state.discoveredDishes.map(d => `
          <div class="collection-item">
            <strong>${d.name}</strong>
            <span>${d.emojis} ｜ ${d.containerLabel}</span>
          </div>
        `).join("");
      }
      bookModal.classList.add("open");
    }

    // ========= 8. 事件綁定與初始化 =========
    btnCook.addEventListener("click", startCooking);
    btnReset.addEventListener("click", resetAll);

    btnCloseResult.addEventListener("click", () => {
      SoundFX.playClick();
      resultModal.classList.remove("open");
    });

    btnClearTable.addEventListener("click", () => {
      SoundFX.playClick();
      state.servedTableDishes = [];
      renderDiningTable();
    });

    btnBook.addEventListener("click", openRecipeBook);
    btnCloseBook.addEventListener("click", () => {
      SoundFX.playClick();
      bookModal.classList.remove("open");
    });

    btnSound.addEventListener("click", () => {
      state.soundEnabled = !state.soundEnabled;
      btnSound.textContent = state.soundEnabled ? "🔊 音效：開" : "🔇 音效：關";
      if (state.soundEnabled) SoundFX.playClick();
    });

    [resultModal, bookModal].forEach(modal => {
      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.remove("open");
      });
    });

    renderIngredients();
    renderMethods();
    updateStageUI();
    renderDiningTable();
  </script>
</body>
</html>
